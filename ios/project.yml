name: NuruNuru
options:
  bundleIdPrefix: io.nurunuru
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.2"
  generateEmptyDirectories: false
  groupSortPosition: top

packages:
  secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    from: "0.22.0"
  NuruNuru:
    path: ../rust-engine/nurunuru-ffi/ios

targets:
  NuruNuru:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NuruNuru
        excludes:
          - "Info.plist"
          # App Store submission build: ろくなな / diVine short-video feature is disabled.
          - "Views/Screens/RokunanaView.swift"
          - "ViewModels/RokunanaViewModel.swift"
          - "Models/RokunanaVideo.swift"
          - "Data/NostrRepository+Rokunana.swift"
    info:
      path: NuruNuru/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UISceneConfigurations: {}
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - LineSeedJP-Rg.ttf
          - LineSeedJP-Bd.ttf
        CFBundleShortVersionString: "1.5.0"
        CFBundleVersion: "6"
        CFBundleDisplayName: ぬるぬる
        CFBundleURLTypes:
          - CFBundleURLName: io.nurunuru.app
            CFBundleURLSchemes:
              - nurunuru
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: 秘密鍵の保護に生体認証を使用します
        NSCameraUsageDescription: QRコード読み取りのためにカメラを使用します
        NSSpeechRecognitionUsageDescription: 投稿や引用投稿で音声入力を行うために音声認識を使用します
        NSMicrophoneUsageDescription: 投稿や引用投稿で音声を収録するためにマイクを使用します
        NSPhotoLibraryUsageDescription: 投稿や引用投稿のためにフォトライブラリから画像や動画を選択します
        NSLocationWhenInUseUsageDescription: 最寄りのNostrリレーを自動検出するために位置情報を使用します
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        # iPadOS is intentionally unsupported for this App Store submission.
        # Do not declare iPad-specific orientations; TARGETED_DEVICE_FAMILY is iPhone-only.
        # UISupportedInterfaceOrientations~ipad:
        #   - UIInterfaceOrientationPortrait
        #   - UIInterfaceOrientationPortraitUpsideDown
        #   - UIInterfaceOrientationLandscapeLeft
        #   - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nurunuru.app
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "6"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "66G7S3P755"
        # iPhone only. iPadOS support is intentionally disabled for Review.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NURUNURU_FFI_AVAILABLE
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG NURUNURU_FFI_AVAILABLE
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: NURUNURU_FFI_AVAILABLE
    dependencies:
      - package: secp256k1
        product: P256K
      - package: NuruNuru
        product: NuruNuruFFILib

  NuruNuruTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - NuruNuruTests
    dependencies:
      - target: NuruNuru
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.nurunuru.app.tests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
