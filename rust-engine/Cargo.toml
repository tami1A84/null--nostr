[workspace]
members = ["nurunuru-core", "nurunuru-ffi", "nurunuru-napi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NuruNuru Team"]
description = "High-performance Nostr engine for the NuruNuru client"

[workspace.dependencies]
nostr-sdk = { version = "0.44", features = ["all-nips"] }
nostr = "0.44"
nostr-ndb = "0.44"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# Pin MDK crates to upstream main for current Marmot MIP-00/01/02/03 support.
# commit: 592a582cf421f87292fba11e5e23a3861b2ec9e0
mdk-core = { git = "https://github.com/marmot-protocol/mdk.git", rev = "592a582cf421f87292fba11e5e23a3861b2ec9e0", package = "mdk-core" }
mdk-sqlite-storage = { git = "https://github.com/marmot-protocol/mdk.git", rev = "592a582cf421f87292fba11e5e23a3861b2ec9e0", package = "mdk-sqlite-storage" }
# Android cross-compilation of MDK's SQLCipher requires vendored OpenSSL;
# otherwise libsqlite3-sys looks for host OpenSSL headers and FFI .so builds fail.
rusqlite = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
mdk-storage-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "592a582cf421f87292fba11e5e23a3861b2ec9e0", package = "mdk-storage-traits" }
hex = "0.4"
base64 = "0.22"
hkdf = "0.12"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# Temporary patch to bump libcrux-aead/libcrux-chacha20poly1305 to 0.0.8
# Fixes GHSA-hc3c-63hc-2r9f
# TODO: Remove once cryspen/hpke-rs releases 0.6.2 (or whichever version) including the bump
[patch.crates-io]
hpke-rs = { git = "https://github.com/cryspen/hpke-rs.git", rev = "110d7477d64317724581955d8975a68c34efbed6" }
hpke-rs-libcrux = { git = "https://github.com/cryspen/hpke-rs.git", rev = "110d7477d64317724581955d8975a68c34efbed6" }
hpke-rs-rust-crypto = { git = "https://github.com/cryspen/hpke-rs.git", rev = "110d7477d64317724581955d8975a68c34efbed6" }
hpke-rs-crypto = { git = "https://github.com/cryspen/hpke-rs.git", rev = "110d7477d64317724581955d8975a68c34efbed6" }
