[package]
name = "nurunuru-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core Nostr engine: protocol logic, recommendation, caching via rust-nostr + nostrdb"

[dependencies]
nostr-sdk = { workspace = true }
nostr = { workspace = true }
nostr-ndb = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
mdk-core = { workspace = true }
# Needed for MdkSqliteStorage::new_unencrypted() used by app runtime.
mdk-sqlite-storage = { workspace = true, features = ["test-utils"] }
mdk-storage-traits = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
# Force SQLCipher to use vendored OpenSSL for Android cross-compilation.
# mdk-sqlite-storage enables rusqlite/bundled-sqlcipher; this direct dep unifies
# the additional libsqlite3-sys/bundled-sqlcipher-vendored-openssl feature.
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = "3"
